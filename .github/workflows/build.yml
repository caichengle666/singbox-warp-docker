name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/singbox-warp-docker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest versions
        id: versions
        run: |
          set -euo pipefail
          SINGBOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/^v//')
          WGCF_VERSION=$(curl -fsSL https://api.github.com/repos/ViRb3/wgcf/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "singbox=$SINGBOX_VERSION" >> "$GITHUB_OUTPUT"
          echo "wgcf=$WGCF_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sb-${{ steps.versions.outputs.singbox }}
            type=raw,value=wgcf-${{ steps.versions.outputs.wgcf }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SINGBOX_VERSION=${{ steps.versions.outputs.singbox }}
            WGCF_VERSION=${{ steps.versions.outputs.wgcf }}
