name: build-and-push

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/singbox-warp-docker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n deploy.sh entrypoint.sh scripts/*.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning -e SC2034 deploy.sh entrypoint.sh scripts/*.sh
          expected_version="$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"/\1/p' deploy.sh | head -n1)"
          test -n "$expected_version"
          version="$(bash deploy.sh --version)"
          grep -Fq "singbox-warp manager v${expected_version}" <<<"$version"
          output="$(printf '15\n' | FORCE_STDIN=1 bash deploy.sh)"
          grep -Fq '正在通过 sudo 请求权限' <<<"$output"
          grep -Fq '[deploy] 退出' <<<"$output"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Release tags follow the manager version so the two never drift.
            test "${{ github.ref_name }}" = "v${expected_version}" || {
              echo "::error::tag ${{ github.ref_name }} does not match SCRIPT_VERSION ${expected_version}"
              exit 1
            }
          fi

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config -q

      - name: Detect code changes
        id: changes
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'Dockerfile'
              - 'entrypoint.sh'
              - 'docker-compose.yml'
              - '.env.example'
              - 'config/**'
              - 'scripts/**'
              - '.github/workflows/build.yml'

      - name: Resolve latest versions
        id: versions
        run: |
          set -euo pipefail
          SINGBOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/^v//')
          WGCF_VERSION=$(curl -fsSL https://api.github.com/repos/ViRb3/wgcf/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "singbox=$SINGBOX_VERSION" >> "$GITHUB_OUTPUT"
          echo "wgcf=$WGCF_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate sing-box template with sing-box check
        run: |
          set -euo pipefail
          version="${{ steps.versions.outputs.singbox }}"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" -o /tmp/sb.tgz
          tar -xzf /tmp/sb.tgz -C /tmp
          bash scripts/check-template.sh "/tmp/sing-box-${version}-linux-amd64/sing-box"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if rebuild is needed
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: forcing build"
            exit 0
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Release tag ${{ github.ref_name }}: building"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ steps.changes.outputs.code }}" = "true" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Push contains code/config changes: building"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Push only changed docs/non-build files: skipping"
            fi
            exit 0
          fi

          SB_TAG="sb-${{ steps.versions.outputs.singbox }}"
          WGCF_TAG="wgcf-${{ steps.versions.outputs.wgcf }}"
          NEED_BUILD=0
          if ! docker manifest inspect "${IMAGE_NAME}:${SB_TAG}" >/dev/null 2>&1; then
            NEED_BUILD=1
          fi
          if ! docker manifest inspect "${IMAGE_NAME}:${WGCF_TAG}" >/dev/null 2>&1; then
            NEED_BUILD=1
          fi
          if [ "$NEED_BUILD" -eq 1 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Rebuild required: missing ${SB_TAG} or ${WGCF_TAG}"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skip build: both ${SB_TAG} and ${WGCF_TAG} already exist"
          fi

      - name: Set up QEMU
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build test image (amd64)
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: singbox-warp-docker:ci-test
          provenance: false
          sbom: false
          build-args: |
            SINGBOX_VERSION=${{ steps.versions.outputs.singbox }}
            WGCF_VERSION=${{ steps.versions.outputs.wgcf }}
            USQUE_VERSION=4.2.1

      - name: Runtime test (every protocol end to end)
        id: runtime
        if: steps.gate.outputs.should_build == 'true'
        env:
          KEEP_CONTAINER: "true"
        run: |
          set -euo pipefail
          version="${{ steps.versions.outputs.singbox }}"
          bash -x scripts/runtime-test.sh singbox-warp-docker:ci-test "/tmp/sing-box-${version}-linux-amd64/sing-box" 2>&1 | tee /tmp/runtime-test.log

      # Temporary: publish the failing log to a ci-debug branch so it can be
      # read without signing in to the Actions UI.
      - name: Publish runtime test log (debug)
        if: failure() && steps.runtime.outcome == 'failure'
        run: |
          set -x
          mkdir -p /tmp/dbg && cd /tmp/dbg
          cp /tmp/runtime-test.log . || true
          docker logs swd-runtime-test > container.log 2>&1 || true
          docker ps -a > ps.txt 2>&1 || true
          git init -q -b ci-debug
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "runtime test log ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-debug

      - name: Docker metadata
        if: steps.gate.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sb-${{ steps.versions.outputs.singbox }}
            type=raw,value=wgcf-${{ steps.versions.outputs.wgcf }}
            type=sha

      - name: Build and push
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            SINGBOX_VERSION=${{ steps.versions.outputs.singbox }}
            WGCF_VERSION=${{ steps.versions.outputs.wgcf }}
            USQUE_VERSION=4.2.1

      - name: Publish GitHub release
        if: steps.gate.outputs.should_build == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          sha256sum deploy.sh > deploy.sh.sha256
          notes="$(mktemp)"
          {
            echo "镜像 / Image: \`${IMAGE_NAME}:${tag#v}\`"
            echo
            echo "- sing-box ${{ steps.versions.outputs.singbox }}"
            echo "- wgcf ${{ steps.versions.outputs.wgcf }}"
            echo
            echo "固定版本部署：把 compose 里的 image 改成 \`${IMAGE_NAME}:${tag#v}\`。"
            echo "deploy.sh 校验：\`sha256sum -c deploy.sh.sha256\`"
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" deploy.sh deploy.sh.sha256 --clobber
          else
            gh release create "$tag" deploy.sh deploy.sh.sha256 --title "$tag" --notes-file "$notes" --generate-notes
          fi

      - name: Cleanup old GHCR versions (keep latest 3)
        if: steps.gate.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          repo="${GITHUB_REPOSITORY#*/}"
          package_name="singbox-warp-docker"
          owner_type="$(gh api "/repos/${owner}/${repo}" --jq '.owner.type')"
          case "$owner_type" in
            User) owner_scope="users/${owner}" ;;
            Organization) owner_scope="orgs/${owner}" ;;
            *) echo "Unsupported package owner type: $owner_type" >&2; exit 1 ;;
          esac
          versions_file="$(mktemp)"
          trap 'rm -f "$versions_file"' EXIT
          gh api --paginate --slurp "/${owner_scope}/packages/container/${package_name}/versions" > "$versions_file"
          protected_tags=(
            latest
            "sb-${{ steps.versions.outputs.singbox }}"
            "wgcf-${{ steps.versions.outputs.wgcf }}"
            "sha-${GITHUB_SHA:0:7}"
          )
          versions="$(jq -r --arg sb "${protected_tags[1]}" --arg wgcf "${protected_tags[2]}" --arg sha "${protected_tags[3]}" '
            map(.[]) |
            sort_by(.created_at) |
            reverse |
            .[] |
            select(((.metadata.container.tags // []) | any(. == "latest" or . == $sb or . == $wgcf or . == $sha or test("^[0-9]+[.][0-9]+"))) | not) |
            [.id, .created_at, (.metadata.container.tags // [] | join(","))] |
            @tsv
          ' "$versions_file")"
          count="$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l)"
          echo "Found $count old GHCR versions to evaluate"
          for version_id in $(printf '%s\n' "$versions" | sed '/^$/d' | tail -n +4 | cut -f1); do
            echo "Deleting GHCR version id=${version_id}"
            gh api -X DELETE "/${owner_scope}/packages/container/${package_name}/versions/${version_id}"
          done

      - name: Cleanup GitHub Actions caches
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner,
              repo,
              per_page: 100
            });
            core.info(`Found ${caches.length} cache entries`);
            for (const cache of caches) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id
                });
                core.info(`Deleted cache id=${cache.id} key=${cache.key}`);
              } catch (e) {
                core.warning(`Failed deleting cache id=${cache.id}: ${e.message}`);
              }
            }
