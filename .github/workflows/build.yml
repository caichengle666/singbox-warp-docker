name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/singbox-warp-docker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n deploy.sh entrypoint.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning -e SC2034 deploy.sh entrypoint.sh
          version="$(bash deploy.sh --version)"
          grep -Fq 'singbox-warp manager v2.0.3' <<<"$version"
          output="$(printf '15\n' | FORCE_STDIN=1 bash deploy.sh)"
          grep -Fq '正在通过 sudo 请求权限' <<<"$output"
          grep -Fq '[deploy] 退出' <<<"$output"

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config -q

      - name: Detect code changes
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'Dockerfile'
              - 'entrypoint.sh'
              - 'docker-compose.yml'
              - '.env.example'
              - 'config/**'
              - '.github/workflows/build.yml'

      - name: Validate sing-box template
        run: |
          set -euo pipefail
          test -f config/sing-box.template.json
          rendered="$(cat config/sing-box.template.json)"
          rendered="${rendered//__HY2_PORT__/32443}"
          rendered="${rendered//__VLESS_PORT__/38443}"
          rendered="${rendered//__HY2_TAG__/hy2-test}"
          rendered="${rendered//__VLESS_TAG__/vless-test}"
          rendered="${rendered//__HY2_PASSWORD__/dummy_hy2_password}"
          rendered="${rendered//__VLESS_UUID__/11111111-1111-1111-1111-111111111111}"
          rendered="${rendered//__TLS_DOMAIN__/example.com}"
          rendered="${rendered//__TLS_CERT_PATH__/\/etc\/sing-box\/certs\/fullchain.pem}"
          rendered="${rendered//__TLS_KEY_PATH__/\/etc\/sing-box\/certs\/privkey.pem}"
          rendered="${rendered//__WARP_PEER_PORT__/2408}"
          rendered="${rendered//__WARP_PEER_HOST__/engage.cloudflareclient.com}"
          rendered="${rendered//__WARP_ADDRESS_V4__/172.16.0.2/32}"
          rendered="${rendered//__WARP_ADDRESS_V6__/2606:4700:110:8765::2/128}"
          rendered="${rendered//__WARP_PRIVATE_KEY__/dummy_private_key}"
          rendered="${rendered//__WARP_PEER_PUBLIC_KEY__/dummy_peer_public_key}"
          rendered="${rendered//__MIXED_PORT__/1080}"
          echo "$rendered" | jq empty

      - name: Resolve latest versions
        id: versions
        run: |
          set -euo pipefail
          SINGBOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/^v//')
          WGCF_VERSION=$(curl -fsSL https://api.github.com/repos/ViRb3/wgcf/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "singbox=$SINGBOX_VERSION" >> "$GITHUB_OUTPUT"
          echo "wgcf=$WGCF_VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if rebuild is needed
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: forcing build"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ steps.changes.outputs.code }}" = "true" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Push contains code/config changes: building"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Push only changed docs/non-build files: skipping"
            fi
            exit 0
          fi

          SB_TAG="sb-${{ steps.versions.outputs.singbox }}"
          WGCF_TAG="wgcf-${{ steps.versions.outputs.wgcf }}"
          NEED_BUILD=0
          if ! docker manifest inspect "${IMAGE_NAME}:${SB_TAG}" >/dev/null 2>&1; then
            NEED_BUILD=1
          fi
          if ! docker manifest inspect "${IMAGE_NAME}:${WGCF_TAG}" >/dev/null 2>&1; then
            NEED_BUILD=1
          fi
          if [ "$NEED_BUILD" -eq 1 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Rebuild required: missing ${SB_TAG} or ${WGCF_TAG}"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skip build: both ${SB_TAG} and ${WGCF_TAG} already exist"
          fi

      - name: Set up QEMU
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        if: steps.gate.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sb-${{ steps.versions.outputs.singbox }}
            type=raw,value=wgcf-${{ steps.versions.outputs.wgcf }}
            type=sha

      - name: Build and push
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            SINGBOX_VERSION=${{ steps.versions.outputs.singbox }}
            WGCF_VERSION=${{ steps.versions.outputs.wgcf }}

      - name: Cleanup old GHCR versions (keep latest 3)
        if: steps.gate.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          repo="${GITHUB_REPOSITORY#*/}"
          package_name="singbox-warp-docker"
          owner_type="$(gh api "/repos/${owner}/${repo}" --jq '.owner.type')"
          case "$owner_type" in
            User) owner_scope="users/${owner}" ;;
            Organization) owner_scope="orgs/${owner}" ;;
            *) echo "Unsupported package owner type: $owner_type" >&2; exit 1 ;;
          esac
          versions_file="$(mktemp)"
          trap 'rm -f "$versions_file"' EXIT
          gh api --paginate --slurp "/${owner_scope}/packages/container/${package_name}/versions" > "$versions_file"
          protected_tags=(
            latest
            "sb-${{ steps.versions.outputs.singbox }}"
            "wgcf-${{ steps.versions.outputs.wgcf }}"
            "sha-${GITHUB_SHA:0:7}"
          )
          versions="$(jq -r --arg sb "${protected_tags[1]}" --arg wgcf "${protected_tags[2]}" --arg sha "${protected_tags[3]}" '
            map(.[]) |
            sort_by(.created_at) |
            reverse |
            .[] |
            select(((.metadata.container.tags // []) | any(. == "latest" or . == $sb or . == $wgcf or . == $sha)) | not) |
            [.id, .created_at, (.metadata.container.tags // [] | join(","))] |
            @tsv
          ' "$versions_file")"
          count="$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l)"
          echo "Found $count old GHCR versions to evaluate"
          for version_id in $(printf '%s\n' "$versions" | sed '/^$/d' | tail -n +4 | cut -f1); do
            echo "Deleting GHCR version id=${version_id}"
            gh api -X DELETE "/${owner_scope}/packages/container/${package_name}/versions/${version_id}"
          done

      - name: Cleanup GitHub Actions caches
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner,
              repo,
              per_page: 100
            });
            core.info(`Found ${caches.length} cache entries`);
            for (const cache of caches) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id
                });
                core.info(`Deleted cache id=${cache.id} key=${cache.key}`);
              } catch (e) {
                core.warning(`Failed deleting cache id=${cache.id}: ${e.message}`);
              }
            }
