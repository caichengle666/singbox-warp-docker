services:
  singbox-warp:
    # 默认使用已发布镜像（适合在其他设备直接拉取运行）
    # 如需固定版本，可改成：
    # image: ghcr.io/caichengle666/singbox-warp-docker@sha256:<digest>
    image: ghcr.io/caichengle666/singbox-warp-docker:latest

    # 如需本地源码构建，请将上面的 image 替换为下面这段 build 配置；版本留空时自动获取最新发布版：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     SINGBOX_VERSION: ""
    #     WGCF_VERSION: ""
    container_name: singbox-warp
    restart: unless-stopped
    ports:
      # 注意：Compose 不会根据 ENABLE_HY2/ENABLE_VLESS 自动删除端口映射；
      # 关闭协议时请手动移除对应端口，交互脚本生成的 Compose 会自动处理。
      # HY2 需要同时开放 TCP + UDP
      - "${HY2_PORT:-32443}:${HY2_PORT:-32443}/tcp"
      - "${HY2_PORT:-32443}:${HY2_PORT:-32443}/udp"
      # VLESS(TCP)
      - "${VLESS_PORT:-38443}:${VLESS_PORT:-38443}/tcp"
      # Mixed (HTTP + SOCKS5) 本地代理，仅开放给宿主机本地使用
      - "127.0.0.1:${MIXED_PORT:-1080}:${MIXED_PORT:-1080}/tcp"
    volumes:
      # WARP 账号与 profile 持久化
      - ./data:/var/lib/wgcf
      # TLS 证书目录（手动证书模式必须有 fullchain.pem/privkey.pem）
      - ./certs:/etc/sing-box/certs
      # acme.sh 数据目录（AUTO_TLS=true 时使用）
      - ./acme:/var/lib/acme
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      # 检查 sing-box 进程存活，并经 Mixed/WARP 出口发起真实 HTTPS 请求
      test: ["CMD-SHELL", "test -s /run/sing-box.pid && kill -0 \"$(cat /run/sing-box.pid)\" && curl -fsS --max-time 3 --proxy \"socks5h://127.0.0.1:${MIXED_PORT:-1080}\" https://cp.cloudflare.com/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      # 端口
      - HY2_PORT=${HY2_PORT:-32443}
      - VLESS_PORT=${VLESS_PORT:-38443}
      - ENABLE_HY2=${ENABLE_HY2:-true}
      - ENABLE_VLESS=${ENABLE_VLESS:-true}
      - MIXED_PORT=${MIXED_PORT:-1080}
      # 认证信息：不填时会自动生成并在日志打印节点链接
      - AUTH_UUID=${AUTH_UUID:-}
      - HY2_PASSWORD=${HY2_PASSWORD:-}
      - VLESS_UUID=${VLESS_UUID:-}

      # TLS 模式：
      # AUTO_TLS=false -> 使用 ./certs 里的手动证书
      # AUTO_TLS=true  -> 使用 Cloudflare DNS API 自动签发证书
      # [必填] AUTO_TLS（必须明确 true/false）
      - AUTO_TLS=${AUTO_TLS:-false}
      # [必填] TLS_DOMAIN（两种 TLS 模式都必须填写，节点链接依赖该域名）
      - TLS_DOMAIN=${TLS_DOMAIN:-}
      - TLS_CERT_PATH=${TLS_CERT_PATH:-/etc/sing-box/certs/fullchain.pem}
      - TLS_KEY_PATH=${TLS_KEY_PATH:-/etc/sing-box/certs/privkey.pem}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - TLS_ISSUE_RETRIES=${TLS_ISSUE_RETRIES:-3}
      - TLS_RENEW_INTERVAL=${TLS_RENEW_INTERVAL:-43200}

      # WARP+ 可选，不填为普通 WARP
      - WARP_LICENSE_KEY=${WARP_LICENSE_KEY:-}

      # [必填] 仅 AUTO_TLS=true 需要 CF_Token（需有对应 Zone 的 DNS 编辑权限）
      - CF_Token=${CF_Token:-}
      - CF_Account_ID=${CF_Account_ID:-}
      - CF_Zone_ID=${CF_Zone_ID:-}

      # 手动证书模式额外必填（文件必需存在）：
      # [必填文件] ./certs/fullchain.pem
      # [必填文件] ./certs/privkey.pem
