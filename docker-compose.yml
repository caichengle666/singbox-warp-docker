version: "3.9"

services:
  singbox-warp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SINGBOX_VERSION: ${SINGBOX_VERSION:-1.11.8}
        WGCF_VERSION: ${WGCF_VERSION:-2.2.26}
    container_name: singbox-warp
    restart: unless-stopped
    ports:
      - "${HY2_PORT:-32443}:${HY2_PORT:-32443}/tcp"
      - "${HY2_PORT:-32443}:${HY2_PORT:-32443}/udp"
      - "${VLESS_PORT:-38443}:${VLESS_PORT:-38443}/tcp"
    volumes:
      - ./data:/var/lib/wgcf
      - ./certs:/etc/sing-box/certs
      - ./acme:/var/lib/acme
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sing-box >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - HY2_PORT=${HY2_PORT:-32443}
      - VLESS_PORT=${VLESS_PORT:-38443}
      - AUTH_UUID=${AUTH_UUID:-}
      - HY2_PASSWORD=${HY2_PASSWORD:-}
      - VLESS_UUID=${VLESS_UUID:-}
      - AUTO_TLS=${AUTO_TLS:-false}
      - TLS_DOMAIN=${TLS_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - TLS_ISSUE_RETRIES=${TLS_ISSUE_RETRIES:-3}
      - TLS_RENEW_INTERVAL=${TLS_RENEW_INTERVAL:-43200}
      - CF_Token=${CF_Token:-}
      - CF_Account_ID=${CF_Account_ID:-}
      - CF_Zone_ID=${CF_Zone_ID:-}
